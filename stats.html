<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workout App — Statistiche</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

  <nav id="main-nav">
    <a href="index.html"     class="nav-item"><span class="nav-icon">🏠</span><span>Home</span></a>
    <a href="session.html"   class="nav-item"><span class="nav-icon">▶️</span><span>Sessione</span></a>
    <a href="history.html"   class="nav-item"><span class="nav-icon">📋</span><span>Storico</span></a>
    <a href="stats.html"     class="nav-item active"><span class="nav-icon">📊</span><span>Stats</span></a>
    <a href="exercises.html" class="nav-item"><span class="nav-icon">💪</span><span>Esercizi</span></a>
  </nav>

  <main id="stats-page">

    <h1 class="page-title">Statistiche</h1>

    <!-- Filtro periodo -->
    <div class="filter-pills">
      <button class="filter-pill" data-period="7">7 giorni</button>
      <button class="filter-pill active" data-period="30">30 giorni</button>
      <button class="filter-pill" data-period="90">3 mesi</button>
      <button class="filter-pill" data-period="0">Tutto</button>
    </div>

    <!-- KPI globali -->
    <div class="kpi-row" id="kpi-row">
      <div class="kpi-card"><div class="kpi-value" id="kpi-sessions">—</div><div class="kpi-label">Sessioni</div></div>
      <div class="kpi-card"><div class="kpi-value" id="kpi-volume">—</div><div class="kpi-label">Volume kg</div></div>
      <div class="kpi-card"><div class="kpi-value" id="kpi-freq">—</div><div class="kpi-label">Sess/sett</div></div>
      <div class="kpi-card"><div class="kpi-value" id="kpi-sets">—</div><div class="kpi-label">Serie tot</div></div>
    </div>

    <!-- Volume nel tempo -->
    <div class="stats-section">
      <div class="stats-section-title">Volume per sessione (kg)</div>
      <div class="chart-wrapper" style="height:180px;">
        <canvas id="chart-volume"></canvas>
      </div>
    </div>

    <!-- Gruppi muscolari -->
    <div class="stats-section">
      <div class="stats-section-title">Gruppi muscolari più allenati</div>
      <div id="muscle-bars"></div>
    </div>

    <!-- Personal Record -->
    <div class="stats-section">
      <div class="stats-section-title">Personal Record</div>
      <div id="pr-list">
        <div class="loading-state" style="padding:20px 0;">Caricamento...</div>
      </div>
    </div>

    <!-- Progressione esercizio -->
    <div class="stats-section">
      <div class="stats-section-title">Progressione esercizio</div>
      <select class="stats-select" id="progress-select">
        <option value="">Seleziona un esercizio...</option>
      </select>
      <div class="chart-wrapper" style="height:180px;">
        <canvas id="chart-progress"></canvas>
      </div>
      <p id="progress-empty" class="text-muted" style="font-size:13px;text-align:center;padding:12px 0;">
        Seleziona un esercizio per vedere la progressione
      </p>
    </div>

    <!-- RPE medio -->
    <div class="stats-section">
      <div class="stats-section-title">Difficoltà percepita media (RPE)</div>
      <div class="chart-wrapper" style="height:160px;">
        <canvas id="chart-rpe"></canvas>
      </div>
    </div>

  </main>

  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/stats.js"></script>

</body>
</html>
