<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workout App — Esercizi</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f1117" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Workout" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav id="main-nav">
    <a href="index.html"     class="nav-item"><span class="nav-icon">🏠</span><span>Home</span></a>
    <a href="session.html"   class="nav-item"><span class="nav-icon">▶️</span><span>Sessione</span></a>
    <a href="history.html"   class="nav-item"><span class="nav-icon">📋</span><span>Storico</span></a>
    <a href="stats.html"     class="nav-item"><span class="nav-icon">📊</span><span>Stats</span></a>
    <a href="exercises.html" class="nav-item active"><span class="nav-icon">💪</span><span>Esercizi</span></a>
  </nav>

  <main id="exercises-page">

    <h1 class="page-title">Libreria Esercizi</h1>

    <!-- Ricerca -->
    <div class="field" style="margin-bottom:12px;">
      <input type="text" id="ex-search" placeholder="Cerca esercizio..." autocomplete="off" />
    </div>

    <!-- Filtri tipo attrezzatura -->
    <div class="filter-pills" id="type-filters" style="margin-bottom:10px;">
      <button class="filter-pill active" data-type="">Tutti</button>
      <button class="filter-pill" data-type="bodyweight">🏃 Corpo libero</button>
      <button class="filter-pill" data-type="band">↔️ Banda</button>
      <button class="filter-pill" data-type="kettlebell">🏋️ Kettlebell</button>
    </div>

    <!-- Lista esercizi -->
    <section id="exercise-grid">
      <div class="loading-state">Caricamento...</div>
    </section>

  </main>

  <!-- FAB: aggiungi esercizio -->
  <button id="btn-new-ex" aria-label="Nuovo esercizio" style="
    position:fixed; bottom:calc(var(--nav-h) + 14px); right:16px;
    width:56px; height:56px; border-radius:50%;
    background:var(--success); color:#0f1117;
    font-size:28px; border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 20px rgba(79,201,122,0.45);
    z-index:50; -webkit-tap-highlight-color:transparent;">+</button>

  <!-- Modal crea / modifica esercizio -->
  <dialog id="modal-exercise">
    <div class="modal-header">
      <h2 id="modal-ex-title">Nuovo esercizio</h2>
      <button class="btn-close-modal" id="btn-close-ex">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="ex-edit-id" />

      <div class="field">
        <label for="ex-name">Nome esercizio</label>
        <input type="text" id="ex-name" placeholder="es. Push-up, Squat, Swing..." />
      </div>

      <div class="field">
        <label for="ex-muscle">Gruppo muscolare</label>
        <select id="ex-muscle">
          <option value="">Seleziona...</option>
          <option value="petto">Petto</option>
          <option value="schiena">Schiena</option>
          <option value="spalle">Spalle</option>
          <option value="bicipiti">Bicipiti</option>
          <option value="tricipiti">Tricipiti</option>
          <option value="core">Core</option>
          <option value="gambe">Gambe</option>
          <option value="glutei">Glutei</option>
          <option value="full body">Full body</option>
        </select>
      </div>

      <div class="field">
        <label>Attrezzatura</label>
        <div class="radio-group">
          <div class="radio-pill"><input type="radio" name="ex-type" id="ex-bw"   value="bodyweight" checked /><label for="ex-bw">🏃 Corpo libero</label></div>
          <div class="radio-pill"><input type="radio" name="ex-type" id="ex-band" value="band" /><label for="ex-band">↔️ Banda</label></div>
          <div class="radio-pill"><input type="radio" name="ex-type" id="ex-kb"   value="kettlebell" /><label for="ex-kb">🏋️ Kettlebell</label></div>
        </div>
      </div>

      <div class="field">
        <label for="ex-notes">Note progressione (opz.)</label>
        <textarea id="ex-notes" placeholder="es. Aumenta prima le reps, poi aggiungi peso. Focus sull'esplosività..."></textarea>
      </div>

      <button class="btn btn-primary btn-full" id="btn-save-ex">Salva esercizio</button>
    </div>
  </dialog>

  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/exercises.js"></script>
  <script src="js/pwa.js"></script>

</body>
</html>
