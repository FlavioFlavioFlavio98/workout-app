<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workout App — Storico</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f1117" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Workout" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav id="main-nav">
    <a href="index.html"     class="nav-item"><span class="nav-icon">🏠</span><span>Home</span></a>
    <a href="session.html"   class="nav-item"><span class="nav-icon">▶️</span><span>Sessione</span></a>
    <a href="history.html"   class="nav-item active"><span class="nav-icon">📋</span><span>Storico</span></a>
    <a href="stats.html"     class="nav-item"><span class="nav-icon">📊</span><span>Stats</span></a>
    <a href="exercises.html" class="nav-item"><span class="nav-icon">💪</span><span>Esercizi</span></a>
  </nav>

  <main id="history-page">

    <h1 class="page-title">Storico</h1>

    <!-- Filtro periodo -->
    <div class="filter-pills" id="filter-pills">
      <button class="filter-pill" data-filter="7d">7 giorni</button>
      <button class="filter-pill" data-filter="30d">30 giorni</button>
      <button class="filter-pill active" data-filter="all">Tutto</button>
    </div>

    <!-- Mini calendario mensile -->
    <div class="calendar-section">
      <div id="calendar-container"></div>
    </div>

    <!-- Lista sessioni -->
    <section id="session-list">
      <!-- Generata da history.js -->
    </section>

    <!-- Carica altro -->
    <div style="text-align:center; padding: 8px 0 16px;">
      <button id="btn-load-more" class="btn btn-ghost hidden">Carica sessioni precedenti</button>
    </div>

  </main>

  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/history.js"></script>
  <script src="js/pwa.js"></script>

</body>
</html>
